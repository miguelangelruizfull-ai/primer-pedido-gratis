<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muestra gratis para tu negocio | Trabajos y pedidos por WhatsApp</title>
<meta name="description" content="Crea una primera muestra para tu negocio, conoce trabajos terminados y contacta directamente a negocios locales por WhatsApp.">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="theme-color" content="#7c3aed">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_MX">
<meta property="og:title" content="Tu primera muestra gratis">
<meta property="og:description" content="Una foto real. Una pieza lista para publicar.">
<style>
:root{
  --bg:#fbf9ff;--ink:#171321;--muted:#6d6578;--card:#ffffffdc;--line:#e8e0f2;
  --purple:#7c3aed;--violet:#9f67ff;--pink:#ff4fa3;--coral:#ff7657;--cyan:#27c7e8;
  --lime:#b8ef70;--ok:#159b69;--danger:#c43d5c;--shadow:0 24px 70px #6d45a51a;
  --max:1120px;--r:28px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  background:
    radial-gradient(580px 440px at -8% 2%,#ffd3e9 0,transparent 67%),
    radial-gradient(620px 440px at 102% 3%,#d8d0ff 0,transparent 65%),
    radial-gradient(560px 360px at 80% 46%,#c9f7ff 0,transparent 66%),
    linear-gradient(180deg,#fff 0,#fbf9ff 48%,#fff8fb 100%);
  font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}
a{color:inherit}
.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}
.topbar{position:sticky;top:0;z-index:40;background:#ffffffd9;border-bottom:1px solid #ffffffcc;backdrop-filter:blur(18px)}
.topin{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:950;letter-spacing:-.035em;font-size:1.04rem}
.contactTop{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:#fff;font-weight:850;font-size:.9rem}
.hero{padding:48px 0 28px}
.heroGrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:24px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 30px #7c3aed0c}
.badgeDot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple))}
h1{font-size:clamp(3rem,7vw,6.1rem);line-height:.92;letter-spacing:-.065em;margin:18px 0 16px;max-width:800px}
.rainbowText{background:linear-gradient(90deg,var(--purple),var(--pink) 45%,var(--coral) 72%,#e3a300);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:660px;color:var(--muted);font-size:clamp(1.02rem,2vw,1.22rem);margin:0}
.trustRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{padding:8px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:.84rem;color:#52495e}
.storyChooser{margin-top:24px}
.choiceRail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choiceCard{position:relative;min-height:245px;border:0;border-radius:24px;overflow:hidden;padding:0;cursor:pointer;text-align:left;background:#26202e;box-shadow:var(--shadow);isolation:isolate}
.choiceCard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.choiceCard:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 28%,#17132110 45%,#171321e8 100%);z-index:1}
.choiceCard.recommend{background:
  radial-gradient(circle at 78% 18%,#ffd564 0 8%,transparent 9%),
  radial-gradient(circle at 22% 24%,#55e8ff 0 11%,transparent 12%),
  radial-gradient(circle at 72% 72%,#ff6aac 0 15%,transparent 16%),
  linear-gradient(135deg,#7c3aed,#3d2d91)}
.choiceCard.recommend:after{background:linear-gradient(180deg,#ffffff08,#171321b5)}
.choiceCard.selected{outline:4px solid #fff;box-shadow:0 0 0 4px var(--purple),var(--shadow)}
.choiceContent{position:absolute;z-index:2;left:16px;right:16px;bottom:15px;color:#fff}
.choiceKicker{display:block;font-size:.7rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase;opacity:.84}
.choiceTitle{display:block;font-size:1.55rem;font-weight:950;line-height:1;margin-top:4px;letter-spacing:-.04em}
.choiceSub{display:block;font-size:.82rem;margin-top:6px;color:#f6effa}
.stageRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stageBtn{min-height:44px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850;cursor:pointer}
.stageBtn.selected{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border-color:transparent}
.heroAction{display:inline-flex;margin-top:14px;min-height:52px;align-items:center;justify-content:center;padding:13px 18px;border-radius:16px;text-decoration:none;font-weight:950;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;box-shadow:0 16px 38px #9f3dba30}
.phoneMock{background:linear-gradient(160deg,#1a1522,#2b1f3d);border-radius:34px;padding:13px;box-shadow:0 28px 90px #3c245640;transform:rotate(2deg)}
.phoneScreen{position:relative;overflow:hidden;aspect-ratio:9/16;border-radius:26px;background:
  radial-gradient(circle at 20% 12%,#ff72b7 0 12%,transparent 13%),
  radial-gradient(circle at 84% 22%,#79ddff 0 14%,transparent 15%),
  linear-gradient(160deg,#f8d6ff,#d9e1ff 48%,#fff0d3)}
.mockCard{position:absolute;left:12%;right:12%;bottom:9%;background:#ffffffeb;border-radius:22px;padding:16px;box-shadow:0 18px 50px #3b25562b}
.mockPill{display:inline-block;padding:6px 9px;border-radius:999px;background:#171321;color:#fff;font-size:.7rem;font-weight:900}
.mockTitle{font-size:1.55rem;line-height:1.02;font-weight:950;letter-spacing:-.045em;margin:10px 0 6px}
.mockText{font-size:.82rem;color:#6b6073}
.mockDots{display:flex;gap:5px;margin-top:12px}.mockDots span{width:22px;height:6px;border-radius:99px}.mockDots span:nth-child(1){background:var(--purple)}.mockDots span:nth-child(2){background:var(--pink)}.mockDots span:nth-child(3){background:var(--cyan)}
.formats{padding:34px 0}
.formatGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.formatCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 34px #6d45a50c}
.formatCard strong{display:block;font-size:1.05rem}.formatCard span{display:block;color:var(--muted);font-size:.86rem;margin-top:3px}
.order{padding:34px 0 56px}
.orderShell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.formCard,.summaryCard{background:var(--card);border:1px solid #ffffff;border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.formCard{padding:20px}
.summaryCard{padding:18px;position:sticky;top:80px}
.summaryColor{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--coral),#f0bf36,var(--cyan));margin-bottom:16px}
.summaryCard h3{margin:0 0 12px;font-size:1.2rem}
.summaryLine{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}.summaryLine span{color:var(--muted)}.summaryLine b{text-align:right}
.progressHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.progressHead strong{font-size:1rem}.progressText{font-size:.84rem;color:var(--muted);font-weight:800}
.bar{height:7px;background:#eee9f4;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar span{display:block;height:100%;width:33.333%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--coral));transition:width .25s ease}
.stepPane{display:none}.stepPane.active{display:block}
.stepTitle{font-size:1.6rem;letter-spacing:-.04em;margin:0 0 5px}.stepCopy{margin:0 0 18px;color:var(--muted)}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
label{font-weight:850;font-size:.92rem}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:12px 13px;outline:none}
textarea{min-height:78px;resize:vertical}
.goalGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.goalBtn{min-height:52px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);padding:11px 12px;font-weight:900;text-align:left;cursor:pointer}
.goalBtn.selected{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink),var(--coral));box-shadow:0 10px 26px #9f3dba22}
.shareHint{margin-top:12px;padding:11px 12px;border-radius:14px;background:#f3edff;border:1px solid #e1d3fb;color:#594d67;font-size:.86rem}
.logoState{margin-top:7px;color:var(--muted);font-size:.82rem;font-weight:750}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #bfa6ff;outline-offset:2px;border-color:#9f67ff}
.req{color:var(--pink)}
.uploadBox{border:2px dashed #ccbaf0;border-radius:20px;padding:16px;background:linear-gradient(135deg,#fbf7ff,#fff8fc)}
.uploadBox input{background:#fff}
.thumbGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.thumb{aspect-ratio:1;border-radius:13px;overflow:hidden;position:relative;background:#eee}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:5px;right:5px;bottom:5px;padding:4px 6px;background:#171321c9;color:#fff;border-radius:8px;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileNote{margin-top:12px;padding:12px 13px;border-radius:15px;background:#fff4d8;border:1px solid #f4d586;color:#684e13;font-size:.9rem}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px}.consent input{width:auto;min-height:auto;margin-top:4px}.consent label{font-weight:650;color:#5d5566}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.actionsRight{display:flex;gap:10px;margin-left:auto}
.btn{min-height:48px;border-radius:15px;border:1px solid var(--line);padding:11px 16px;font-weight:900;cursor:pointer;background:#fff;color:var(--ink)}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink),var(--coral));box-shadow:0 14px 32px #9f3dba26}
.btn.ghost{background:#fff}
.status{min-height:22px;margin:12px 0 0;color:var(--muted);font-size:.88rem}.status.ok{color:var(--ok);font-weight:800}.status.error{color:var(--danger);font-weight:800}
.contactCard{margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#f4edff,#fff0f7);border:1px solid #eadcf7}.contactCard strong{display:block}.contactCard a{display:inline-block;margin-top:7px;font-weight:900;color:var(--purple)}
.modal{position:fixed;inset:0;z-index:100;background:#21152e99;backdrop-filter:blur(9px);display:grid;place-items:end center;padding:14px}.modal.hidden{display:none}.modalCard{width:min(100%,520px);background:#fff;border-radius:28px;padding:20px;box-shadow:0 28px 90px #2e1e3f55}.modalCard h3{font-size:1.65rem;letter-spacing:-.04em;margin:0 0 7px}.modalCard p{color:var(--muted);margin:0 0 16px}.modalActions{display:grid;gap:9px}
.success{display:none;text-align:center;padding:34px 16px}.success.show{display:block}.successMark{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--lime),var(--cyan));font-size:2rem;font-weight:950}.success h3{font-size:2rem;letter-spacing:-.045em;margin:0 0 8px}.success p{color:var(--muted);max-width:520px;margin:0 auto 18px}
footer{padding:28px 0 90px;color:#81768d;font-size:.82rem;border-top:1px solid #eee6f3}.footerIn{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.footerLinks{display:flex;gap:12px;flex-wrap:wrap}.footerLinks a{font-weight:800}
.mobileCta{display:none}.hidden{display:none!important}
@media(hover:hover) and (pointer:fine){.choiceCard:hover img{transform:scale(1.04)}.heroAction:hover,.btn.primary:hover{filter:saturate(1.12)}}
@media(max-width:860px){.heroGrid,.orderShell{grid-template-columns:1fr}.phoneMock{max-width:360px;margin:auto;transform:none}.summaryCard{position:static}.formatGrid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:640px){
  .wrap{width:min(calc(100% - 20px),var(--max))}.topin{min-height:56px}.contactTop{font-size:.8rem;padding:8px 10px}
  .hero{padding:32px 0 22px}h1{font-size:clamp(2.8rem,14vw,4.4rem)}
  .heroGrid{gap:20px}.phoneMock{display:none}
  .choiceRail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 3px 9px}.choiceCard{flex:0 0 82%;min-height:320px;scroll-snap-align:center}
  .formatGrid,.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.formats{padding:24px 0}.order{padding-top:24px}
  .actions{flex-direction:column}.actionsRight{width:100%;margin-left:0}.actions .btn,.actionsRight .btn{width:100%}.thumbGrid{grid-template-columns:repeat(3,1fr)}
  .summaryCard{display:none}.formCard{padding:14px;border-radius:22px}
  .formGrid{gap:10px}input,select,textarea{min-height:46px;padding:10px 12px}textarea{min-height:76px}.goalGrid{grid-template-columns:1fr 1fr}.goalBtn{min-height:50px;padding:10px}
  .mobileCta{position:fixed;display:flex;z-index:55;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:7px;border-radius:18px;background:#ffffffea;border:1px solid #fff;box-shadow:0 18px 48px #5e3e7b30;backdrop-filter:blur(16px);transition:.2s}.mobileCta .heroAction{width:100%;margin:0}.mobileCta.hide{transform:translateY(130%);opacity:0;pointer-events:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

const channelNames={facebook:"Desde Facebook",instagram:"Desde Instagram",whatsapp:"Desde WhatsApp",maps:"Negocio local",presencial:"Prueba presencial",directo:"Primera muestra gratis"};
$("channelBadge").textContent=channelNames[source]||"Primera muestra gratis";

const formObserver=new IntersectionObserver(entries=>{
  entries.forEach(entry=>$("mobileCta").classList.toggle("hide",entry.isIntersecting));
},{threshold:.12});
formObserver.observe($("orderForm"));
updateSummary();
renderLogo();
</script>
</body>
</html>
